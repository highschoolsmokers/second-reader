services:
  second-reader:
    build: .
    container_name: second-reader
    env_file: .env
    environment:
      - TRANSPORT=http
      - PORT=3000
      - LOG_LEVEL=info
      # If ./certs/localhost.pem and ./certs/localhost-key.pem exist
      # (generated by mkcert), the server starts on HTTPS automatically.
      # Remove these two lines to force plain HTTP.
      - SSL_CERT_PATH=/app/certs/localhost.pem
      - SSL_KEY_PATH=/app/certs/localhost-key.pem
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads   # for PDF ingestion
      - ./evals:/app/evals       # for eval results
      - ./certs:/app/certs:ro    # mkcert-generated certs, read-only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://localhost:3000/health',{tls:{rejectUnauthorized:false}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
