services:
  second-reader:
    build: .
    container_name: second-reader
    env_file: .env
    environment:
      - TRANSPORT=http
      - PORT=3000
      - LOG_LEVEL=info
      # If ./certs/localhost.pem and ./certs/localhost-key.pem exist
      # (generated by mkcert), the server starts on HTTPS; if either file is
      # missing it falls back to plain HTTP. Remove these two lines to force HTTP.
      - SSL_CERT_PATH=/app/certs/localhost.pem
      - SSL_KEY_PATH=/app/certs/localhost-key.pem
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads   # for PDF ingestion
      - ./certs:/app/certs:ro    # mkcert-generated certs, read-only
    restart: unless-stopped
    healthcheck:
      # Self-signed mkcert certs aren't trusted inside the container, so skip
      # TLS verification; try HTTPS first, then plain HTTP.
      test: ["CMD-SHELL", "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://localhost:3000/health').catch(()=>fetch('http://localhost:3000/health')).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
